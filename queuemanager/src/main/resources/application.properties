#  Smart Outpatient Queue Management System
server.port=8080

spring.datasource.url=use_yours
spring.datasource.username=use_yours
spring.datasource.password=use_yours
spring.datasource.driver-class-name=use_yours

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=use_yours
jwt.expiry.ms=use_yours

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Scheduler (for midnight queue reset)
spring.task.scheduling.pool.size=5

# Logging
logging.level.com.smartqueue=DEBUG
logging.level.org.springframework.security=INFO
